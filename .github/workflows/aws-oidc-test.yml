name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-connection:
    runs-on: ubuntu-latest

    environment: dev

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::823196744431:role/GitHubTerraformDevRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity